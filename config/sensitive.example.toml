version = 1

[policy]
on_missing = "warn"
# Enable only if local services may receive policy-protected data.
trust_loopback = false
# Optional limits use the built-in defaults; see sensitive.example.toml for overrides.

# No Git repository is exempt by default. Repeat the table for each trusted push URL.
# [[allow-git-url]]
# url = "https://git.example.com/team/project.git"

# Replace the synthetic rule with your own files, folders and literal text.
# Guard writes confirmed derived files into [[rules.copy]] under their source rule.
[[rules]]
id = "PS7-HTTP-CANARY-001"
action = "block"
files = []
folders = []
texts = ["PS7GUARD_TEST_SECRET"]
